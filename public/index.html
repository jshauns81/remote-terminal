<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05080f" />
  <meta name="color-scheme" content="dark" />
  <title>nexus</title>

  <!-- PWA: installable, standalone (no browser chrome), home-screen icon.
       iOS ignores manifest.webmanifest pre-16.4 and Safari-in-standalone
       still wants the apple-* tags explicitly, so both paths are covered. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="nexus" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand" aria-label="nexus">
        <span class="brand-dot"></span>
        <span class="brand-name">nexus</span>
      </div>

      <!-- Tabs grouped by product, one pill each. data-name is the stable id the
           server and Zellij use; only the visible labels are Shaun's names.
           data-web marks a web pane (iframe under /web/<name>/) instead of a
           Zellij terminal tab. Option+1..7 follows this left-to-right order. -->
      <nav id="tabs" class="tabgroup" role="tablist" aria-label="Claude">
        <button class="tab" role="tab" data-name="claude" aria-selected="true">
          <span class="tab-dot"></span><span class="tab-label">Claude Terminal</span>
        </button>
        <button class="tab" role="tab" data-name="claudeai" data-web="/web/claudeai/" aria-selected="false">
          <span class="tab-dot"></span><span class="tab-label">Claude.ai Web</span>
        </button>
      </nav>
      <nav class="tabgroup" role="tablist" aria-label="OpenAI">
        <button class="tab" role="tab" data-name="codex" aria-selected="false">
          <span class="tab-dot"></span><span class="tab-label">Codex Terminal</span>
        </button>
        <button class="tab" role="tab" data-name="chatgpt" data-web="/web/chatgpt/" aria-selected="false">
          <span class="tab-dot"></span><span class="tab-label">ChatGPT Web</span>
        </button>
      </nav>
      <nav class="tabgroup" role="tablist" aria-label="Homelab">
        <button class="tab" role="tab" data-name="host" aria-selected="false">
          <span class="tab-dot"></span><span class="tab-label">Unraid</span>
        </button>
        <button class="tab" role="tab" data-name="llm" aria-selected="false">
          <span class="tab-dot"></span><span class="tab-label">BankBreak</span>
        </button>
        <button class="tab" role="tab" data-name="opencode" aria-selected="false">
          <span class="tab-dot"></span><span class="tab-label">OpenCode</span>
        </button>
      </nav>

      <button id="wake" class="wake hidden" title="Send Wake-on-LAN to the LLM desktop">
        <span class="wake-dot"></span><span class="wake-label">wake</span>
      </button>

      <div class="configure-wrap">
        <button id="configure" class="iconbtn" title="Configure" aria-expanded="false">
          <span class="iconbtn-glyph" aria-hidden="true">⚙</span><span class="iconbtn-label">configure</span>
        </button>
        <div id="configure-panel" class="popover hidden" role="dialog" aria-label="Configure">
          <div class="popover-title">Configure</div>
          <div class="popover-row">
            <span class="popover-label">Font size</span>
            <div class="segctl segctl-stepper">
              <button class="segctl-btn" id="font-dec" aria-label="Decrease font size">−</button>
              <span class="segctl-value" id="font-value">15</span>
              <button class="segctl-btn" id="font-inc" aria-label="Increase font size">+</button>
            </div>
          </div>
          <div class="popover-row">
            <span class="popover-label">Cursor</span>
            <div class="popover-controls">
              <div class="segctl" id="cursor-style-group" role="group" aria-label="Cursor style">
                <button class="segctl-btn" data-cursor-style="block" aria-selected="true">block</button>
                <button class="segctl-btn" data-cursor-style="underline" aria-selected="false">line</button>
                <button class="segctl-btn" data-cursor-style="bar" aria-selected="false">bar</button>
              </div>
              <button class="toggle-switch" id="cursor-blink-btn" role="switch" aria-checked="true" title="Blink">
                <span class="toggle-knob"></span>
              </button>
            </div>
          </div>
          <div class="popover-row">
            <span class="popover-label">Copy on select</span>
            <button class="toggle-switch" id="copy-select-toggle" role="switch" aria-checked="true">
              <span class="toggle-knob"></span>
            </button>
          </div>
          <div class="popover-row">
            <span class="popover-label">Scrollback</span>
            <select class="select-input" id="scrollback-select">
              <option value="1000">1,000</option>
              <option value="5000">5,000</option>
              <option value="10000">10,000</option>
              <option value="50000">50,000</option>
            </select>
          </div>
          <!-- Recover: fix one stuck piece without disturbing the rest. -->
          <div class="popover-title popover-subtitle">Recover</div>
          <div class="recover-grid">
            <button class="recover-btn" id="rec-reconnect" type="button"
                    title="Drop and reopen this page's connection. Nothing on the server restarts.">
              <span class="recover-name">Reconnect</span><span class="recover-hint">this device</span></button>
            <button class="recover-btn" id="rec-tab" type="button"
                    title="Restart the connection behind the current tab (ssh / docker exec, or the browser container).">
              <span class="recover-name">Restart tab</span><span class="recover-hint" id="rec-tab-hint">current tab</span></button>
            <button class="recover-btn" id="rec-bridge" type="button"
                    title="Restart nexus's web server. Terminal sessions keep running; every device reconnects.">
              <span class="recover-name">Restart bridge</span><span class="recover-hint">sessions kept</span></button>
            <button class="recover-btn" id="rec-reload" type="button"
                    title="Reload the app to pick up updates (the installed app keeps old code until reloaded).">
              <span class="recover-name">Reload app</span><span class="recover-hint">fresh code</span></button>
          </div>
          <button class="recover-btn recover-wide" id="rec-maint" type="button"
                  title="See every Claude / Codex / OpenCode session on the server -- which are in use, which are orphaned -- plus zombie processes.">
            <span class="recover-name">Maintenance…</span><span class="recover-hint">sessions, orphans, zombies</span></button>
        </div>
      </div>

      <button id="logout" class="iconbtn" title="Sign out of nexus (terminals keep running)">
        <span class="iconbtn-glyph" aria-hidden="true">⏻</span><span class="iconbtn-label">logout</span>
      </button>

      <div id="status" class="status" data-state="connecting" title="connection status">
        <span class="status-dot"></span>
        <span class="status-label">connecting</span>
      </div>
    </header>

    <main id="stage">
      <section id="frame" aria-label="terminal">
        <div id="term"></div>
        <div id="scroll-track" class="scroll-track" aria-hidden="true">
          <div id="scroll-thumb" class="scroll-thumb"></div>
        </div>
        <div id="boot" class="boot" aria-hidden="true">
          <div class="boot-inner">
            <span class="boot-mark"></span>
            <span class="boot-text">connecting to nexus</span>
          </div>
        </div>
      </section>

      <!-- Web pane: the containerized Chromium browsers (claude-browser,
           chatgpt-browser) streamed in iframes, proxied under nexus's own
           origin at /web/<name>/ (server/web-proxy.js) so the nexus login
           covers them -- no second, frame-busted login. Hidden until a web tab
           is selected; each iframe loads on first select. The pop-out opens
           the current one in a full browser tab. -->
      <section id="webframe" class="webframe hidden" aria-label="web view">
        <!-- One iframe per web tab (claude.ai, chatgpt), created by nexus.js on
             first select and kept alive after, so switching between them
             doesn't drop either remote-browser stream. -->
        <template id="webview-tpl">
          <iframe class="webview"
                  allow="clipboard-read; clipboard-write; fullscreen; autoplay"
                  referrerpolicy="no-referrer"></iframe>
        </template>
        <div class="webctls">
          <button id="webreload" class="webctl" type="button"
                  title="Reload claude.ai (reconnect the stream)" aria-label="Reload claude.ai">⟳</button>
          <a id="webpop" class="webctl" href="/web/claudeai/"
             target="_blank" rel="noopener"
             title="Open claude.ai in a new browser tab" aria-label="Open in a new tab">↗</a>
        </div>
      </section>
    </main>

    <!-- Maintenance panel: every tool session on the server, in use or
         orphaned, plus zombies. Only orphaned sessions get a checkbox; the
         server re-checks each one before killing and refuses anything nexus
         or anything still attached. Filled by nexus.js from /api/maint/scan. -->
    <div id="maint" class="maint hidden" role="dialog" aria-modal="true" aria-labelledby="maint-title">
      <div class="maint-card">
        <header class="maint-head">
          <div>
            <h2 id="maint-title">Maintenance</h2>
            <p class="maint-sub" id="maint-sub">Scanning…</p>
          </div>
          <div class="maint-actions">
            <button class="maint-btn" id="maint-refresh" type="button">Refresh</button>
            <button class="maint-btn maint-danger" id="maint-kill" type="button" disabled>Kill selected</button>
            <button class="maint-btn maint-x" id="maint-close" type="button" aria-label="Close">✕</button>
          </div>
        </header>
        <div class="maint-legend">
          <span class="chip chip-nexus">nexus</span> a nexus tab — never killable
          <span class="chip chip-attached">in use</span> another live terminal
          <span class="chip chip-service">service</span> background service
          <span class="chip chip-orphan">orphaned</span> nothing attached — safe to kill
        </div>
        <div class="maint-body" id="maint-body"></div>
      </div>
    </div>

  </div>

  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/addon-fit/addon-fit.js"></script>
  <script src="/vendor/addon-web-links/addon-web-links.js"></script>
  <script src="/vendor/addon-clipboard/addon-clipboard.js"></script>
  <script src="/nexus.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch((err) => {
          console.error("[nexus] service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
